
server.port=8083
spring.application.name=doc-processing

spring.data.mongodb.uri=mongodb://mongodb:27017/processing

app.keycloak.users.issuer=http://keycloak:8080/realms/users
app.keycloak.users.jwks=http://keycloak:8080/realms/users/protocol/openid-connect/certs

app.keycloak.services.issuer=http://keycloak:8080/realms/services
app.keycloak.services.jwks=http://keycloak:8080/realms/services/protocol/openid-connect/certs

logging.level.org.springframework.security=INFO
logging.level.org.keycloak=INFO
logging.level.root=INFO



