server.port=8081
doc-storage.service.url=http://host.docker.internal:8080/api/files-archive

# --- MongoDB Configuration (Temporary Storage) ---
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.gridfs.bucket=raw_documents 

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- Kafka Producer Configuration ---
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.properties.spring.json.value.default.type=com.group8.docprocessing.model.UploadQueueItem
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.bootstrap-servers=${spring.kafka.bootstrap-servers}

spring.kafka.consumer.group-id=doc-processor-group

spring.kafka.consumer.auto-offset-reset=earliest 

spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.consumer.enable-auto-commit=false

doc-processing.kafka.topic.upload-event=document_upload_pending 
doc-processing.kafka.topic.processed-event=document_processed 

management.endpoints.web.exposure.include=*