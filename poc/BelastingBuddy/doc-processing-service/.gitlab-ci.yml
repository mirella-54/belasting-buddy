image: maven:3.8.1-openjdk-17-slim

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  SERVICE_DIR: "poc/BelastingBuddy/doc-processing-service"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

build_doc-processing-service:
  stage: build
  script:
    - cd $SERVICE_DIR
    - mvn clean compile
  artifacts:
    paths:
      - $SERVICE_DIR/target/

test_doc-processing-service:
  stage: test
  script:
    - cd $SERVICE_DIR
    - mvn clean verify
  artifacts:
    when: always
    reports:
      junit: $SERVICE_DIR/target/surefire-reports/*.xml
    paths:
      - $SERVICE_DIR/target/surefire-reports/

checkstyle_doc-processing-service:
  stage: checkstyle
  script:
    - cd $SERVICE_DIR
    - mvn checkstyle:check
  allow_failure: false
