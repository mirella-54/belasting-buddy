version: '3.8'

services:
  # 1. MongoDB Service
  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  # 2. Kafka/Zookeeper Services (Confluent Images)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1 
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1 
      
      JMX_PORT: 5555 # Kafka's internal JMX port
      KAFKA_JMX_HOSTNAME: kafka
      
      # CRITICAL FIX for JMX remote connection from sidecar
      KAFKA_OPTS: -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.rmi.port=5555 -Djava.rmi.server.hostname=kafka -Djava.net.preferIPv4Stack=true -Dcom.sun.management.jmxremote.host=0.0.0.0      
    restart: always
    
  # 3. Dedicated JMX Exporter (Sidecar for Kafka) - FIXED
  kafka-jmx-exporter:
    image: bitnami/jmx-exporter:latest
    container_name: kafka-jmx-exporter
    ports:
      - "5556:5556"
    volumes:
      - ./kafka-jmx-exporter-config.yml:/opt/bitnami/jmx-exporter/conf/config.yml
    environment: # FIXED: Using Environment Variables for configuration
      JMX_HOST: kafka
      JMX_PORT: 5555
      JMX_EXPORTER_PORT: 5556
    depends_on:
      - kafka
    restart: unless-stopped

  # 4. Doc Processing Service (Your Application)
  doc-processing-service:
    build: . 
    container_name: doc-processing-service
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
      - kafka
    environment:
      - SERVER_PORT=8081
      - DOC_STORAGE_SERVICE_URL=http://host.docker.internal:8080/api/files-archive
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=*
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/docprocessingdb 
      - SPRING_DATA_MONGODB_GRIDFS_BUCKET=raw_documents
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092 
      - DOC_PROCESSING_KAFKA_TOPIC_UPLOAD_EVENT=document_upload_pending 
      - DOC_PROCESSING_KAFKA_TOPIC_PROCESSED_EVENT=document_processed
      - LOGGING_LEVEL_ROOT=INFO
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=50MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=50MB
      - SPRING_KAFKA_CONSUMER_GROUP_ID=doc-processor-group 
    restart: always

  # 5. Kafka Exporter (Calculates consumer group lag) - FIXED
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.6.0
    container_name: kafka-exporter
    # FIXED: Reverted to simple command to avoid execution errors
    command: 
      - --kafka.server=kafka:29092 
      - --web.listen-address=:9308
      - --group.filter=.* 
    ports:
      - "9308:9308"
    depends_on:
      - kafka
    restart: unless-stopped

  # 6. Prometheus Server (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml  
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - kafka-jmx-exporter
      - kafka-exporter
      - doc-processing-service
    restart: unless-stopped
    
  # 7. Grafana Server (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongo-data:
  prometheus_data:
  grafana_data: