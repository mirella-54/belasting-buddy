version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kc-pg:/var/lib/postgresql/data
    networks: [ idp-net ]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.2
    container_name: keycloak
    depends_on:
      - postgres
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_DB_SCHEMA: ${KC_DB_SCHEMA}
      KC_LOG_LEVEL: ${KC_LOG_LEVEL}
      KC_HOSTNAME_STRICT: "${KC_HOSTNAME_STRICT}"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    networks: [ idp-net ]

  user-management-service:
    build:
      context: ./user-management-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_TARGET_REALM: ${KEYCLOAK_TARGET_REALM}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      APP_KEYCLOAK_USERS_JWKS: "${APP_KEYCLOAK_USERS_JWKS}"
      APP_KEYCLOAK_SERVICES_JWKS: "${APP_KEYCLOAK_SERVICES_JWKS}"
      APP_KEYCLOAK_SERVICES_TOKEN_URL: "${APP_KEYCLOAK_SERVICES_TOKEN_URL}"
      APP_KEYCLOAK_SERVICES_CLIENT_ID: "${APP_KEYCLOAK_SERVICES_CLIENT_ID}"
      APP_KEYCLOAK_SERVICES_CLIENT_SECRET: "${APP_KEYCLOAK_SERVICES_CLIENT_SECRET}"
    depends_on:
      - keycloak
    ports:
      - "8081:8081"
    networks: [ idp-net ]

  mongodb:
    image: mongo:6
    container_name: mongodb
    volumes:
      - mongo-data:/data/db
    restart: always
    networks: [ idp-net ]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
    ports:
      - "2181:2181"
    restart: always
    networks: [ idp-net ]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      JMX_PORT: 5555
      KAFKA_OPTS: -Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.rmi.port=5555 -Djava.rmi.server.hostname=kafka -Djava.net.preferIPv4Stack=true -Dcom.sun.management.jmxremote.host=0.0.0.0      
    restart: always
    networks: [ idp-net ]

  doc-storage-service:
    build:
      context: ./document-storage-service
    container_name: doc-storage-service
    env_file:
      - ./document-storage-service/.env
    depends_on:
      - mongodb
      - kafka
      - keycloak
    ports:
      - "8083:8083"
    environment:
      
      SERVER_PORT: 8083
      SPRING_DATA_MONGODB_URI: ${DOC_STORAGE_MONGO_URI}
      SPRING_DATA_MONGODB_GRIDFS_BUCKET: ${DOC_STORAGE_MONGO_BUCKET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${DOC_STORAGE_KAFKA_BOOTSTRAP}
      DOC_STORAGE_KAFKA_TOPIC_PROCESSED_EVENT: ${DOC_STORAGE_TOPIC_PROCESSED}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${DOC_STORAGE_GROUP_ID}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_BASE_URL}/realms/users
      APP_KEYCLOAK_USERS_JWKS: ${APP_KEYCLOAK_USERS_JWKS}
      APP_KEYCLOAK_SERVICES_JWKS: ${APP_KEYCLOAK_SERVICES_JWKS}
      APP_KEYCLOAK_SERVICES_TOKEN_URL: "${APP_KEYCLOAK_SERVICES_TOKEN_URL}"
      APP_KEYCLOAK_SERVICES_CLIENT_ID: "${DOC_STORAGE_CLIENT_ID}"
      APP_KEYCLOAK_SERVICES_CLIENT_SECRET: "${DOC_STORAGE_CLIENT_SECRET}"
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}

      GOOGLE_APPLICATION_CREDENTIALS: /app/resources/firebase-service-account.json
    restart: always
    networks: [ idp-net ]
    volumes:
      - ./storage-test-data:/app/files-upload-test
      - ./document-storage-service/src/main/resources/firebase-service-account.json:/app/resources/firebase-service-account.json:ro

  doc-processing-service:
    build:
      context: ./doc-processing-service
    container_name: doc-processing-service
    depends_on:
      - mongodb
      - kafka
      - keycloak
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DOC_STORAGE_SERVICE_URL: http://doc-storage-service:8083
      SPRING_DATA_MONGODB_URI: ${DOC_PROCESSING_MONGO_URI}
      SPRING_DATA_MONGODB_GRIDFS_BUCKET: ${DOC_PROCESSING_MONGO_BUCKET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${DOC_PROCESSING_KAFKA_BOOTSTRAP}
      DOC_PROCESSING_KAFKA_TOPIC_UPLOAD_EVENT: ${DOC_PROCESSING_TOPIC_UPLOAD}
      DOC_PROCESSING_KAFKA_TOPIC_PROCESSED_EVENT: ${DOC_PROCESSING_TOPIC_PROCESSED_EVENT}
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${DOC_PROCESSING_GROUP_ID}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_BASE_URL}/realms/users
      APP_KEYCLOAK_USERS_JWKS: "${APP_KEYCLOAK_USERS_JWKS}"
      APP_KEYCLOAK_SERVICES_JWKS: "${APP_KEYCLOAK_SERVICES_JWKS}"
      APP_KEYCLOAK_SERVICES_TOKEN_URL: "${APP_KEYCLOAK_SERVICES_TOKEN_URL}"
      APP_KEYCLOAK_SERVICES_CLIENT_ID: "${DOC_PROCESSING_CLIENT_ID}"
      APP_KEYCLOAK_SERVICES_CLIENT_SECRET: "${DOC_PROCESSING_CLIENT_SECRET}"
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: '*' 
    restart: always
    networks: [ idp-net ]

  hour-tracking-service:
    build:
      context: ./hour-tracking-service
    container_name: hour-tracking-service
    depends_on:
      - keycloak
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: ${KEYCLOAK_BASE_URL}/realms/users
      APP_KEYCLOAK_USERS_JWKS: ${APP_KEYCLOAK_USERS_JWKS}
      APP_KEYCLOAK_SERVICES_JWKS: ${APP_KEYCLOAK_SERVICES_JWKS}
      APP_KEYCLOAK_SERVICES_TOKEN_URL: "${APP_KEYCLOAK_SERVICES_TOKEN_URL}"
      APP_KEYCLOAK_SERVICES_CLIENT_ID: "${HOUR_TRACKING_CLIENT_ID}"
      APP_KEYCLOAK_SERVICES_CLIENT_SECRET: "${HOUR_TRACKING_CLIENT_SECRET}"
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT}
    restart: always
    networks: [ idp-net ]

  # Dedicated JMX Exporter (Sidecar for Kafka)
