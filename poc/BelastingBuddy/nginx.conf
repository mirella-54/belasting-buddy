events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # User Management Service (port 8080)
        location /api/auth/ {
            proxy_pass http://host.docker.internal:8080/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/admin/ {
            proxy_pass http://host.docker.internal:8080/api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/user/ {
            proxy_pass http://host.docker.internal:8080/api/user/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Document Processing Service (port 8081)
        location /api/documents/ {
            proxy_pass http://host.docker.internal:8081/documents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Hour Tracking Service (port 8082)
        location /api/hours {
            proxy_pass http://host.docker.internal:8082/hours;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/projects {
            proxy_pass http://host.docker.internal:8082/projects;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Document Storage Service (port 8083)
        location /api/storage/ {
            proxy_pass http://host.docker.internal:8083/api/files-archive/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check, so we ca check if gateway is running properly
        location /health {
            access_log off;
            return 200 "Gateway is running\n";
            add_header Content-Type text/plain;
        }

        # (root)
        location / {
            return 200 '{"message":"BelastingBuddy API Gateway","services":["auth","admin","documents","hours","projects","storage"]}';
            add_header Content-Type application/json;
        }
    }
}

